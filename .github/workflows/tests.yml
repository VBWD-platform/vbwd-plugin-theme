name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — theme (lint + unit)
    runs-on: ubuntu-latest

    steps:
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/theme

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vbwd-backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r vbwd-backend/requirements.txt

      - name: Style check — Black
        run: black --check --diff vbwd-backend/plugins/theme/ --exclude='/(\.git|__pycache__|\.pytest_cache)/'

      - name: Style check — Flake8
        run: flake8 vbwd-backend/plugins/theme/ --max-line-length=120 --extend-ignore=E203,W503 --exclude=.git,__pycache__,.pytest_cache

      - name: Style check — Mypy
        run: mypy vbwd-backend/plugins/theme/ --exclude tests/ --ignore-missing-imports --no-error-summary --python-version=3.11 || true

      - name: Run unit tests
        working-directory: vbwd-backend
        run: |
          if [ -d "plugins/theme/tests/unit" ]; then
            python -m pytest plugins/theme/tests/unit/ -v --tb=short
          else
            echo "No unit tests yet"
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run runtime JS tests (node:test, no npm deps)
        working-directory: vbwd-backend
        # Node 22 takes globs, not directories, as --test arguments.
        run: node --test 'plugins/theme/tests/js/*.test.mjs'

  integration:
    name: Integration — theme
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/theme

      - name: Create plugins.json (enable theme + dependencies)
        run: |
          echo '{"plugins":{"theme":{"enabled":true,"version":"1.0.0","source":"local"}}}' > vbwd-backend/plugins/plugins.json

      - name: Start services
        working-directory: vbwd-backend
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/v1/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:5000/api/v1/health || exit 1

      - name: Run integration tests
        working-directory: vbwd-backend
        run: |
          if [ -d "plugins/theme/tests/integration" ] && find plugins/theme/tests/integration -name 'test_*.py' | grep -q .; then
            docker compose run --rm test pytest plugins/theme/tests/integration/ -v --tb=short
          else
            echo "No integration tests yet — skipping"
          fi

      - name: Cleanup
        if: always()
        working-directory: vbwd-backend
        run: docker compose down -v
